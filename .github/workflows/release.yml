
name: Release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.7.5"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          # Do not pin this to main: the workflow also runs for pull requests,
          # and those must build the change under test. A manual dispatch
          # builds the branch it was started from (normally main).
          fetch-depth: 0
          # external/shark is a private repository. SUBMODULE_TOKEN must be a
          # PAT with read access to it; github.token only works if the
          # submodule is public.
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
          submodules: recursive

      - name: Determine version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"

          if [ -z "$tag" ] || [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            tag="dev-${GITHUB_SHA::7}"
          fi

          tag="$(echo "$tag" | sed 's#[^A-Za-z0-9._-]#-#g')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building version: $tag"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      # Ubuntu 24.04 still ships Qt 6.4.2, which is older than what this project
      # builds against (see the find_package() call in ui/CMakeLists.txt), so the
      # Linux job installs the same Qt the Windows job uses. qtwaylandcompositor
      # is what provides the Wayland platform plugins: qtbase alone would leave
      # the AppImage with the xcb plugin only, and the app would fall back to
      # XWayland on Wayland desktops.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
          modules: 'qtwaylandcompositor'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            clang-18 \
            libstdc++-14-dev \
            libsqlite3-dev \
            libssl-dev \
            libwayland-dev \
            libboost-dev \
            libboost-json-dev \
            libboost-regex-dev \
            libboost-url-dev \
            libjpeg-dev \
            libpng-dev \
            libgl-dev \
            libopus-dev \
            libopusenc-dev \
            libopusfile-dev \
            libmpg123-dev \
            libmp3lame-dev \
            qt6-base-dev \
            qt6-qpa-plugins \
            librsvg2-bin \
            wget \
            file

      - name: Check compiler
        run: |
          clang++-18 --version
          clang++-18 -v
          clang++-18 -print-file-name=libstdc++.so
          echo '#include <expected>
          int main() {
              std::expected<int, int> x = 42;
              return x.value();
          }' | clang++-18 -std=c++23 -x c++ -fsyntax-only -

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build AppImage
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          # The UI target's OUTPUT_NAME is local-notebook-${PLATFORM}-${ARCH}
          # (see ui/CMakeLists.txt), so it is not plain "local-notebook".
          executable="build/ui/local-notebook-linux-x86_64"
          appdir="AppDir"

          if [ ! -f "$executable" ]; then
            echo "Executable not found: $executable"
            exit 1
          fi

          mkdir -p "$appdir/usr/bin"

          cp "$executable" "$appdir/usr/bin/local-notebook"

          cat > local-notebook.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Local Notebook
          Exec=local-notebook
          Icon=local-notebook
          Categories=Utility;
          Terminal=false
          EOF

          cp assets/appicon/app-256.png local-notebook.png

          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O linuxdeploy.AppImage

          wget -q \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
            -O linuxdeploy-plugin-qt.AppImage

          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage

          # Make the Qt deployment plugin discoverable.
          sudo mv linuxdeploy-plugin-qt.AppImage /usr/local/bin/linuxdeploy-plugin-qt

          # Deploy the Qt installed by the setup step above, not Ubuntu's 6.4.2:
          # the executable was linked against that one, and linuxdeploy reads the
          # plugin and library locations from QMAKE.
          export PATH="$QT_ROOT_DIR/bin:$PATH"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          # The Qt archives install the tool as "qmake"; only the distro
          # packages add the "qmake6" alias. Point QMAKE inside $QT_ROOT_DIR
          # directly, because "command -v qmake6" would silently find Ubuntu's
          # 6.4.2 and linuxdeploy would deploy that next to a binary linked
          # against 6.8.
          export QMAKE="$QT_ROOT_DIR/bin/qmake"

          if [ ! -x "$QMAKE" ]; then
            export QMAKE="$(command -v qmake6)"
          fi

          export APPIMAGE_EXTRACT_AND_RUN=1

          # Guard the resolution above: deploying a different Qt than the one
          # the executable was linked against produces a broken AppImage, and
          # Ubuntu's Qt ships a Wayland plugin too, so the plugin check below
          # would not notice.
          qt_version="$("$QMAKE" -query QT_VERSION)"
          qt_major="${qt_version%%.*}"
          qt_minor="${qt_version#*.}"
          qt_minor="${qt_minor%%.*}"

          if [ "$qt_major" -lt 6 ] ||
            { [ "$qt_major" -eq 6 ] && [ "$qt_minor" -lt 8 ]; }; then
            echo "qmake from $QMAKE reports Qt $qt_version; 6.8 or newer is needed"
            exit 1
          fi

          # Fail here rather than shipping an X11-only AppImage if the Wayland
          # platform plugin is missing from the Qt installation.
          qt_plugins="$("$QMAKE" -query QT_INSTALL_PLUGINS)"

          if [ ! -f "$qt_plugins/platforms/libqwayland-generic.so" ]; then
            echo "Wayland platform plugin not found in $qt_plugins/platforms"
            echo "Install the qtwaylandcompositor module in the Qt setup step."
            exit 1
          fi

          ./linuxdeploy.AppImage \
            --appdir "$appdir" \
            --desktop-file local-notebook.desktop \
            --icon-file local-notebook.png \
            --plugin qt \
            --output appimage

          appimage="$(find . -maxdepth 1 -name '*.AppImage' \
            ! -name 'linuxdeploy.AppImage' -print -quit)"

          if [ -z "$appimage" ]; then
            echo "AppImage generation failed"
            exit 1
          fi

          mv "$appimage" \
            "local-notebook-${RELEASE_TAG}-linux-x86_64.AppImage"

          file "local-notebook-${RELEASE_TAG}-linux-x86_64.AppImage"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-notebook-linux-x86_64
          path: local-notebook-${{ steps.version.outputs.tag }}-linux-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Build the pull request's changes rather than main; leave the ref
          # unset so a manual dispatch builds the branch it was started from.
          fetch-depth: 0
          # external/shark is private, so fetching it needs a PAT with read
          # access to that repository (see the Linux job).
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
          submodules: recursive

      - name: Determine version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG

          if ([string]::IsNullOrWhiteSpace($tag) -or
              $env:GITHUB_EVENT_NAME -eq "pull_request") {
            $tag = "dev-$($env:GITHUB_SHA.Substring(0, 7))"
          }

          $tag = $tag -replace '[^A-Za-z0-9._-]', '-'
          "tag=$tag" >> $env:GITHUB_OUTPUT

          Write-Host "Building version: $tag"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      # Downloaded sources and vcpkg's built binary packages stay useful even
      # when the build fails, so this cache is kept separately from the
      # installed tree below and saved unconditionally. The workflow hash
      # covers port-list edits; bump the v1 prefix when the runner's vcpkg
      # baseline changes.
      - name: Restore vcpkg downloads cache
        id: vcpkg-downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\vcpkg\downloads
            ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-x64-windows-release-v1-downloads-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            vcpkg-x64-windows-release-v1-downloads-

      # Exact match only: a stale tree restored through a prefix would be
      # reused without `vcpkg install` re-validating the packages in it.
      - name: Restore vcpkg installed packages
        id: vcpkg-installed
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x64-windows-release-v1-installed-${{ hashFiles('.github/workflows/release.yml') }}

      - name: Install SQLite, Boost and OpenSSL
        if: steps.vcpkg-installed.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}\vcpkg-cache,readwrite'
        run: |
          # x64-windows builds Debug and Release; this is a release-only job,
          # so use vcpkg's built-in release-only triplet instead.
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            --triplet x64-windows-release `
            sqlite3 `
            boost-json `
            boost-regex `
            boost-url `
            boost-asio `
            boost-beast `
            openssl `
            libjpeg-turbo `
            libpng `
            opus `
            libopusenc `
            opusfile `
            mpg123 `
            mp3lame

      # Unconditional (within the runner's cancellation grace period) so a
      # failed install or a later failing step does not throw away downloads.
      - name: Save vcpkg downloads cache
        if: always() && steps.vcpkg-downloads.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            C:\vcpkg\downloads
            ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-x64-windows-release-v1-downloads-${{ hashFiles('.github/workflows/release.yml') }}

      # Only save a complete tree: the installed cache is reused without
      # running `vcpkg install`, so a partial install must never be stored.
      - name: Save vcpkg installed packages
        if: success() && steps.vcpkg-installed.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x64-windows-release-v1-installed-${{ hashFiles('.github/workflows/release.yml') }}


      - name: Configure
        run: |
          $vcpkgLib = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-release/lib"

          # external/shark uses find_library() names that do not match the
          # vcpkg import-library filenames on MSVC. The mpg123 1.33 port
          # installs mpg123.lib; mpg123 1.34 renamed it to libmpg123.lib, so
          # accept either rather than pinning one name. LAME installs
          # libmp3lame.lib.
          $mpg123 = @("$vcpkgLib/mpg123.lib", "$vcpkgLib/libmpg123.lib") |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $mpg123) {
            throw "mpg123 import library not found in $vcpkgLib"
          }

          $lame = "$vcpkgLib/libmp3lame.lib"
          if (-not (Test-Path $lame)) {
            throw "LAME import library not found: $lame"
          }

          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DMPG123_LIBRARY=$mpg123" `
            "-DLAME_LIBRARY=$lame" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows-release" `
            "-DCMAKE_CXX_SCAN_FOR_MODULES=OFF" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"


      - name: Build
        shell: pwsh
        run: |
          cmd /c "cmake --build build --parallel > build.log 2>&1"
          $code = $LASTEXITCODE

          if ($code -ne 0) {
            Get-Content build.log -Tail 200

            # Turn the first failures into check-run annotations: the raw job
            # log needs repository admin rights to read through the API, while
            # annotations are publicly visible.
            Get-Content build.log |
              Select-String -Pattern 'error C\d+|error LNK\d+|fatal error|FAILED: |ninja: error:' |
              Select-Object -First 10 |
              ForEach-Object {
                $line = $_.Line.Trim().Replace('%', '%25')
                Write-Host "::error::$line"
              }

            exit $code
          }

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Deploy Windows dependencies
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"

          # Matches OUTPUT_NAME "local-notebook-${PLATFORM}-${ARCH}" in
          # ui/CMakeLists.txt.
          $exe = "build/ui/local-notebook-windows-x86_64.exe"
          $release = "release"

          if (-not (Test-Path $exe)) {
            throw "Executable not found: $exe"
          }

          New-Item -ItemType Directory -Force -Path $release | Out-Null

          $targetExe = "local-notebook-$env:RELEASE_TAG.exe"
          Copy-Item $exe "$release/$targetExe"

          # Deploy Qt DLLs, platform plugins and MSVC runtime.
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" `
            --release `
            --compiler-runtime `
            "$release/$targetExe"

          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed"
          }

          # Deploy the vcpkg runtime libraries: SQLite, OpenSSL and the
          # dynamically linked Boost libraries (boost-json, boost-regex,
          # boost-url and their transitive dependencies).
          $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-release/bin"
          $sqliteDll = "$vcpkgBin/sqlite3.dll"

          if (-not (Test-Path $sqliteDll)) {
            throw "SQLite DLL not found: $sqliteDll"
          }

          Copy-Item "$vcpkgBin/*.dll" $release

          # Package the complete application directory.
          Compress-Archive `
            -Path "$release/*" `
            -DestinationPath "local-notebook-$env:RELEASE_TAG-windows-x86_64.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-notebook-windows-x86_64
          path: local-notebook-${{ steps.version.outputs.tag }}-windows-x86_64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [linux, windows]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: local-notebook-linux-x86_64
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: local-notebook-windows-x86_64
          path: release

      - name: Generate SHA256SUMS
        working-directory: release
        run: sha256sum * > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: main
          generate_release_notes: true
          files: |
            release/*
